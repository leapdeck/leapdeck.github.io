<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>leapdeck – Coding Tools Wheel</title>
  <meta name="description" content="Spin the leapdeck coding tools wheel and open Aider, Trae, Kiro, Replit, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="brand-bar">
      <a class="brand" href="/">
        <img src="/PicLD1.png" alt="leapdeck" class="brand-mark">
        <span class="brand-name">leapdeck</span>
      </a>
      <p class="tagline">Spin a coding tool · tap to open</p>
    </header>

    <main class="stage">
      <div class="wheel-scene" aria-label="Coding tools spinning wheel">
        <div class="wheel-frame">
          <div class="wheel-rim left-rim" aria-hidden="true"></div>

          <div class="wheel-viewport" id="wheelViewport">
            <div class="wheel-drum" id="wheelDrum" role="listbox" aria-label="Coding tools" aria-activedescendant="">
              <!-- Slots rendered by app.js -->
            </div>
            <div class="center-band" aria-hidden="true"></div>
            <div class="viewport-fade top" aria-hidden="true"></div>
            <div class="viewport-fade bottom" aria-hidden="true"></div>
          </div>

          <div class="wheel-rim right-rim" aria-hidden="true">
            <span class="peg"></span>
            <span class="peg"></span>
            <span class="peg"></span>
            <span class="peg"></span>
            <span class="peg"></span>
            <span class="peg"></span>
            <span class="peg"></span>
          </div>
        </div>

        <div class="pointer-stack">
          <div class="clicker" id="clicker" aria-hidden="true"></div>
          <div class="pointer-arrow" aria-hidden="true"></div>
          <button type="button" class="open-btn" id="openBtn" disabled>
            <span class="open-btn-glow" aria-hidden="true"></span>
            <span class="open-btn-label">Open Coding Tool</span>
          </button>
        </div>
      </div>

      <p class="hint" id="hint">Swipe or drag the wheel up or down</p>
      <p class="selected-meta" id="selectedMeta" aria-live="polite"></p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
