  <title>leapdeck – Coding Tools Wheel</title>
  <meta name="description" content="Spin the leapdeck coding tools wheel and open Aider, Trae, Kiro, Replit, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <div class="page">
    <header class="brand-bar">
      <a class="brand" href="/">
        <img src="/PicLD1.png" alt="leapdeck" class="brand-mark">
        <span class="brand-name">leapdeck</span>
      </a>
      <p class="tagline">Spin a coding tool · tap to open</p>
    </header>

    <main class="stage">
      <div class="wheel-scene">
        <div class="wheel-panel">
          <canvas id="wheelCanvas" width="640" height="720" aria-label="Coding tools spin wheel"></canvas>
          <p class="sr-only" id="liveSelected" aria-live="polite"></p>
        </div>

        <div class="pointer-stack">
          <div class="clicker" id="clicker" aria-hidden="true"></div>
          <div class="pointer-arrow" aria-hidden="true"></div>
          <button type="button" class="open-btn" id="openBtn" disabled>
            <span class="open-btn-glow" aria-hidden="true"></span>
            <span>Open Coding Tool</span>
          </button>
        </div>
      </div>

      <p class="hint" id="hint">Swipe or drag the wheel up or down</p>
      <p class="selected-meta" id="selectedMeta"></p>
    </main>
  </div>
